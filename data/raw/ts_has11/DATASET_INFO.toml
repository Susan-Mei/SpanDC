schema_version = 1
dataset_id = "ts_has11"
data_kind = "time_series"
data_file = "ts_11.csv"

[order]
natural_order = true
order_keys = ["time_index"]
time_attribute = "time_sec"
sampling_rate_hz = 50

[attributes]
numeric = [
  "ts_id",
  "time_index",
  "time_sec",
  "x-acc",
  "y-acc",
  "z-acc",
  "x-gyro",
  "y-gyro",
  "z-gyro",
  "x-mag",
  "y-mag",
  "z-mag",
  "change_point_flag",
]
character = [
  "activity",
]
unknown = []
ignored = []

[predicate_space]
candidate_attributes = [
  "x-acc",
  "y-acc",
  "z-acc",
  "x-gyro",
  "y-gyro",
  "z-gyro",
  "x-mag",
  "y-mag",
  "z-mag",
]
cross_attribute_comparison_groups = [
  ["x-acc", "y-acc", "z-acc"],
  ["x-gyro", "y-gyro", "z-gyro"],
  ["x-mag", "y-mag", "z-mag"],
]
label_attributes = [
  "activity",
  "change_point_flag",
]
excluded_attributes = [
  "ts_id",
  "time_index",
  "time_sec",
  "activity",
  "change_point_flag",
]
